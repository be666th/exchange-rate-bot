name: Daily Screenshot and Notify

on:
  schedule:
    - cron: '31 1 * * *'  # รันทุกวันเวลา 08:31 (ไทย) = 01:31 UTC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🐳 Build and push Docker image
        uses: azure/docker-login@v1
        with:
          login-server: yourregistry.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - run: |
          docker build -t yourregistry.azurecr.io/exchange-rate-bot:latest .
          docker push yourregistry.azurecr.io/exchange-rate-bot:latest

      - name: 🚀 Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name exchange-rate-bot \
            --resource-group MyResourceGroup \
            --image yourregistry.azurecr.io/exchange-rate-bot:latest
