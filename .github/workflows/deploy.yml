name: 🚀 Deploy to Azure Container App

on:
  schedule:
    - cron: '30 1 * * *' # Run at 08:30 (Thai time)
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          azureCredentials: ${{ secrets.AZURE_CREDENTIALS }}
          containerAppName: exchange-rate-bot
          resourceGroup: my-first-docker-rg
          containerAppEnvironment: exchange-rate-bot-env
          dockerfilePath: ./Dockerfile
          targetPort: 8000
