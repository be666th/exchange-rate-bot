name: Deploy Exchange Rate Bot

on:
  workflow_dispatch:

concurrency:
  group: deploy-exchange-rate-bot
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TZ: Asia/Bangkok

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build & Push image
        run: |
          IMAGE="${{ secrets.AZURE_REGISTRY_SERVER }}/exchange-rate-bot:latest"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add -n containerapp --upgrade -y
            IMAGE="${{ secrets.AZURE_REGISTRY_SERVER }}/exchange-rate-bot:latest"
            az containerapp update \
              --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"
