name: Screenshot and Notify (BBL → Cloudinary → LINE)

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Bangkok (UTC+7): 08:32, 12:00, 15:00 → UTC 01:32, 05:00, 08:00
    - cron: '32 1 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '0 8 * * 1-5'

permissions:
  contents: read

# If a run is in progress, do NOT cancel; allow new runs to queue (so manual doesn't get canceled)
concurrency:
  group: screenshot_and_notify
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Bot Webhook (initial try + 3 retries)
        env:
          WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "❌ Missing secret BOT_WEBHOOK_URL"
            exit 1
          fi

          echo "▶️ POST $WEBHOOK_URL"
          # initial try
          if curl -fsS -m 30 -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d '{}'; then
            echo "✅ Triggered (initial)"
            exit 0
          fi

          # retry 3 times
          for i in 1 2 3; do
            echo "⏳ Retry $i/3 after 20s..."
            sleep 20
            if curl -fsS -m 30 -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' -d '{}'; then
              echo "✅ Triggered (retry $i)"
              exit 0
            fi
          done

          echo "❌ Failed after 3 retries"
          exit 1
