name: 📸 Screenshot and LINE Notify (Daily)

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Message type to send'
        required: true
        type: choice
        options:
          - bbl
          - superrich
          - combined


jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
      GROUP_ID: ${{ secrets.LINE_GROUP_ID }}

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run Screenshot + LINE Notify
        run: python runner.py ${{ inputs.type }}
