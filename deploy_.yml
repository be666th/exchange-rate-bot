name: Deploy Exchange Rate Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "32 1 * * *"   # 08:32 Asia/Bangkok
    - cron: "0 5 * * *"    # 12:00 Asia/Bangkok
    - cron: "0 8 * * *"    # 15:00 Asia/Bangkok

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.AZURE_REGISTRY_SERVER }}/exchange-rate-bot:latest .
          docker push ${{ secrets.AZURE_REGISTRY_SERVER }}/exchange-rate-bot:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name exchange-rate-bot \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_REGISTRY_SERVER }}/exchange-rate-bot:latest
